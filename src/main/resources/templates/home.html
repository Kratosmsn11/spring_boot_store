<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>SubsHub</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <header class="app-header">
        <div class="header-left">
            <a th:href="@{/home}" class="logo-area">
                <img th:src="@{/images/logo.png}" alt="SubsHub" style="height: 40px;" />
            </a>
        </div>

        <div class="header-right">
            <span class="welcome-text">Hello, <span th:text="${username}">User</span></span>
            <form th:action="@{/logout}" method="post" class="logout-form">
                <button type="submit" class="btn-logout">Logout</button>
            </form>
        </div>
    </header>
    <main class="app-content">
        <h1>Welcome to SubHub</h1>
        <p>This is your protected content area.</p>

        <section>
            <h2>Categories</h2>
            <ul th:if="${not #lists.isEmpty(categories)}">
                <li th:each="category : ${categories}" th:text="${category.name}"></li>
            </ul>
            <p th:if="${#lists.isEmpty(categories)}">No categories found.</p>
        </section>
    </main>

    <footer class="app-footer">
        <p>System Status: Online</p>
        <p class="version-tag">Version: <span th:text="${version}">0.0.0</span></p>
    </footer>
</body>
</html>
